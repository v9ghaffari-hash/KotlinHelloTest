name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create test APK
        run: |
          mkdir -p app/src/main/java/com/example/hellotest
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KotlinHelloTest"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.hellotest'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.hellotest'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Hello Test">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/hellotest/MainActivity.kt <<'EOF'
          package com.example.hellotest

          import android.app.Activity
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  var count = 0
                  val text = TextView(this).apply {
                      text = "سلام! برنامهٔ آزمایشی اجرا شد."
                      textSize = 22f
                      setPadding(24, 40, 24, 24)
                  }
                  val button = Button(this).apply {
                      text = "شمارنده: 0"
                      setOnClickListener {
                          count++
                          text = "شمارنده: $count"
                      }
                  }
                  setContentView(LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 24)
                      addView(text)
                      addView(button)
                  })
              }
          }
          EOF
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KotlinHelloTest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
